<ion-header [translucent]="true" class="ion-no-border app-header" mode="md">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="settings-wrap">
    <div class="section-label"><h2>Security</h2></div>
    <div class="app-card">
      <div class="card-head">
        <div class="icon-tile tile-capital"><ion-icon name="key-outline"></ion-icon></div>
        <div>
          <h3>Change PIN</h3>
          <p>Every other device will be signed out</p>
        </div>
      </div>

      <ion-item lines="none" class="field">
        <ion-input label="Current PIN" labelPlacement="stacked" type="password" inputmode="numeric"
          [(ngModel)]="changePinData.oldPin" maxlength="4" placeholder="••••"></ion-input>
      </ion-item>

      <ion-item lines="none" class="field">
        <ion-input label="New 4-digit PIN" labelPlacement="stacked" type="password" inputmode="numeric"
          [(ngModel)]="changePinData.newPin" maxlength="4" placeholder="••••"></ion-input>
      </ion-item>

      <ion-button expand="block" class="app-btn" color="primary" (click)="onChangePin()"
        [disabled]="!changePinData.oldPin || changePinData.newPin?.length !== 4 || isChangingPin">
        @if (isChangingPin) {
          <ion-spinner slot="start" name="crescent"></ion-spinner>
        }
        Change PIN
      </ion-button>
    </div>
  </div>

  <ion-toast
    [isOpen]="showToast"
    [message]="toastMessage"
    [duration]="2500"
    [color]="toastColor"
    (didDismiss)="showToast = false"
  ></ion-toast>
</ion-content>
