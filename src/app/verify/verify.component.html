<ion-content class="ion-padding">
  <div class="lock-wrap">
    <div class="app-card lock-card">
      <div class="lock-icon"><ion-icon name="lock-closed"></ion-icon></div>
      <h1>Finance Secured</h1>
      <p class="lock-sub">Sign in with your username and 4-digit PIN.</p>

      <ion-item lines="none" class="field">
        <ion-input
          label="Username"
          labelPlacement="stacked"
          [(ngModel)]="username"
          autocapitalize="off"
          autocomplete="off"
          [spellcheck]="false"
          placeholder="e.g. admin"></ion-input>
      </ion-item>

      <ion-item lines="none" class="field pin-field">
        <ion-input
          type="text"
          class="pin-mask"
          inputmode="numeric"
          name="finance-pin"
          [(ngModel)]="pin"
          maxlength="4"
          placeholder="Enter PIN"
          autocomplete="off"
          aria-label="PIN"
          (keyup.enter)="verify()"></ion-input>
      </ion-item>

      @if (errorMsg) {
        <div class="banner banner-error">
          <ion-icon name="alert-circle-outline"></ion-icon>
          <span>{{ errorMsg }}</span>
        </div>
      }

      <ion-button expand="block" class="app-btn" color="primary" (click)="verify()" [disabled]="!username.trim() || pin.length !== 4 || isVerifying">
        @if (isVerifying) {
          <ion-spinner slot="start" name="crescent"></ion-spinner>
        }
        Sign in
      </ion-button>
    </div>
  </div>
</ion-content>
