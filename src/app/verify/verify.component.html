<ion-content class="ion-padding">
  <div class="lock-wrap">
    <div class="app-card lock-card">
      <div class="lock-icon"><ion-icon name="lock-closed"></ion-icon></div>
      <h1>Finance Secured</h1>
      <p class="lock-sub">Enter your 4-digit PIN to unlock the app.</p>

      <ion-item lines="none" class="field pin-field">
        <ion-input
          type="password"
          inputmode="numeric"
          [(ngModel)]="pin"
          maxlength="4"
          placeholder="••••"
          aria-label="PIN"></ion-input>
      </ion-item>

      @if (errorMsg) {
        <div class="banner banner-error">
          <ion-icon name="alert-circle-outline"></ion-icon>
          <span>{{ errorMsg }}</span>
        </div>
      }

      <ion-button expand="block" class="app-btn" color="primary" (click)="verify()" [disabled]="pin?.length !== 4 || isVerifying">
        @if (isVerifying) {
          <ion-spinner slot="start" name="crescent"></ion-spinner>
        }
        Unlock app
      </ion-button>
    </div>
  </div>
</ion-content>
