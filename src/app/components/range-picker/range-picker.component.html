<!-- ‹ [Month · October 2026 ⌄] ›: the arrows step between periods, the middle opens the choices -->
<div class="rp">
  <ion-button fill="clear" size="small" class="rp-step" [class.rp-off]="!steps()" [disabled]="!steps()" (click)="step(-1)"
    [attr.aria-label]="'Previous ' + names[kind()].toLowerCase()">
    <ion-icon slot="icon-only" name="chevron-back"></ion-icon>
  </ion-button>
  <button type="button" class="rp-current" (click)="open()" aria-haspopup="dialog"
    [attr.aria-label]="'Date range: ' + names[kind()] + ', ' + picked().label + '. Change'">
    <span class="rp-kind">{{ names[kind()] }}</span>
    <span class="rp-label">{{ picked().label }}<ion-icon name="chevron-down"></ion-icon></span>
  </button>
  <ion-button fill="clear" size="small" class="rp-step" [class.rp-off]="!steps()" [disabled]="!steps()" (click)="step(1)"
    [attr.aria-label]="'Next ' + names[kind()].toLowerCase()">
    <ion-icon slot="icon-only" name="chevron-forward"></ion-icon>
  </ion-button>
</div>

<!-- The choices as rows, the picked one ticked; a custom range behind a hairline at the bottom -->
<ion-modal [isOpen]="sheetOpen()" (didDismiss)="sheetOpen.set(false)" [initialBreakpoint]="1" [breakpoints]="[0, 1]"
  class="range-sheet">
  <ng-template>
    <div class="rs">
      <h3 class="rs-title">Show</h3>
      <div role="listbox" aria-label="Date range">
        @for (k of presets; track k) {
          <button type="button" class="rs-row" [class.on]="kind() === k" role="option" [attr.aria-selected]="kind() === k" (click)="choose(k)">
            <span class="rs-name">{{ names[k] }}</span>
            <span class="rs-value">{{ presetLabel(k) }}</span>
            <ion-icon class="rs-check" name="checkmark"></ion-icon>
          </button>
        }
        <button type="button" class="rs-row" [class.on]="kind() === 'all'" role="option" [attr.aria-selected]="kind() === 'all'" (click)="choose('all')">
          <span class="rs-name">{{ names.all }}</span>
          <span class="rs-value">{{ allTimeLabel() }}</span>
          <ion-icon class="rs-check" name="checkmark"></ion-icon>
        </button>
        <div class="rs-rule"></div>
        <button type="button" class="rs-row" [class.on]="kind() === 'custom'" role="option" [attr.aria-selected]="kind() === 'custom'"
          [attr.aria-expanded]="editingCustom()" (click)="choose('custom')">
          <span class="rs-name">{{ names.custom }}</span>
          <span class="rs-value">{{ customLabel() }}</span>
          <ion-icon class="rs-check" [name]="kind() === 'custom' ? 'checkmark' : 'chevron-down'"></ion-icon>
        </button>
      </div>

      @if (editingCustom()) {
        <div class="rs-custom">
          <div class="field-row">
            <ion-item lines="none" class="field date-field" button [detail]="false" [id]="uid + '-from'">
              <div class="date-text">
                <span class="date-label">From</span>
                <span class="date-value">{{ showDay(draftFrom(), 'd MMM yy') }}</span>
              </div>
              <ion-icon slot="end" name="calendar-outline" class="date-icon"></ion-icon>
            </ion-item>
            <ion-item lines="none" class="field date-field" button [detail]="false" [id]="uid + '-to'">
              <div class="date-text">
                <span class="date-label">To</span>
                <span class="date-value">{{ showDay(draftTo(), 'd MMM yy') }}</span>
              </div>
              <ion-icon slot="end" name="calendar-outline" class="date-icon"></ion-icon>
            </ion-item>
          </div>
          <!-- Not keepContentsMounted: a calendar kept alive while hidden reopens showing the wrong month's days -->
          <ion-modal #fromModal [trigger]="uid + '-from'" class="date-dialog">
            <ng-template>
              <ion-datetime mode="ios" presentation="date" locale="en-IN" [value]="draftFrom()" [showDefaultTitle]="true"
                (ionChange)="setDraft('from', $event.detail.value); fromModal.dismiss()">
                <span slot="title">From</span>
              </ion-datetime>
            </ng-template>
          </ion-modal>
          <ion-modal #toModal [trigger]="uid + '-to'" class="date-dialog">
            <ng-template>
              <ion-datetime mode="ios" presentation="date" locale="en-IN" [value]="draftTo()" [showDefaultTitle]="true"
                (ionChange)="setDraft('to', $event.detail.value); toModal.dismiss()">
                <span slot="title">To</span>
              </ion-datetime>
            </ng-template>
          </ion-modal>
          <ion-button expand="block" class="app-btn rs-apply" (click)="applyCustom()">Show this range</ion-button>
        </div>
      }
    </div>
  </ng-template>
</ion-modal>
