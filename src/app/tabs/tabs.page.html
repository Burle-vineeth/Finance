<ion-tabs (ionTabsDidChange)="onTabChange($event.tab)">
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon aria-hidden="true" [name]="icon('tab1', 'stats-chart')"></ion-icon>
      <ion-label>Dashboard</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2" href="/tabs/tab2">
      <ion-icon aria-hidden="true" [name]="icon('tab2', 'cash')"></ion-icon>
      <ion-label>Originate</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon aria-hidden="true" [name]="icon('tab3', 'wallet')"></ion-icon>
      <ion-label>Ledger</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="approvals" href="/tabs/approvals">
      <ion-icon aria-hidden="true" [name]="icon('approvals', 'checkmark-done-circle')"></ion-icon>
      <ion-label>Approvals</ion-label>
      @if (pendingCount > 0) {
        <ion-badge color="warning">{{ pendingCount }}</ion-badge>
      }
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
